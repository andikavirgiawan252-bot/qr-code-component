<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- main start -->
    <div class="container">
        <div class="bg_qr">
          <div class="items_qr">
            <img src="/01/qr-code-component-main/images/image-qr-code.png" alt="">
          </div>
          <div class="des_qr">
            <h1 class="text_top">
              Improve your front-end skills by building projects
            </h1>
            <p class="text_bottom">
              Scan the QR code to visit frontend mentor and take your coding skill to the next level
            </p>
          </div>
        </div>
        <!-- main end -->

  <!-- footer start -->
  <footer class="attribution">
    Challenge by <a class="link" href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a class="link-2" href="#">Andika</a>.
  </footer>
  <!-- footer end -->

   </div>
</body>
</html>
